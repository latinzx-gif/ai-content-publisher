version: '3.8'

services:
  # Odoo Web Service
  odoo:
    image: odoo:17.0
    container_name: hr-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped
    networks:
      - odoo-network

  # PostgreSQL Database for Odoo
  db:
    image: postgres:15
    container_name: hr-odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - odoo-network

volumes:
  odoo-data:
    name: hr-odoo-data
  db-data:
    name: hr-odoo-db

networks:
  odoo-network:
    name: hr-odoo-network
    driver: bridge
